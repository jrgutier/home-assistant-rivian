name: Tests

# Principle 4 of the vendoring plan: the CI that enforces the gates must exist
# BEFORE the risky work (the two upstream merges and the client vendoring), not
# after it. This repo previously had no test workflow at all — only
# pre-release.yaml, release.yaml and stale.yaml.
#
# Runs on master alongside pre-release.yaml, deliberately. pre-release.yaml
# runs NO tests -- it builds and publishes the zip beta users install -- so
# before the dev->master rename, betas shipped without this workflow ever
# firing: its triggers named `main` (which never existed on origin) and
# `vendor-client` (deleted 2026-08-22). Both workflows now trigger on master
# so a published beta is one that pytest and ruff have actually seen.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # HA 2026.8.2 requires >=3.14.2. The interpreter is pinned explicitly rather
      # than floored: HA's own floor moves with its releases, and a runner picking a
      # different minor is how "green locally, red in CI" starts.
      - name: Set up Python 3.14
        run: uv python install 3.14

      # Every pin this needs lives in requirements_test.txt, deliberately: a green
      # suite must be reproducible from the repo, not from a recipe embedded in CI.
      - name: Create venv and install
        run: |
          uv venv --python 3.14 .venv
          VIRTUAL_ENV=$PWD/.venv uv pip install -r requirements_test.txt

      # Blocking repo-wide. ruff is intentionally unpinned (see requirements.txt):
      # the findings a pin used to hide were real and are fixed. A new ruff release
      # can therefore turn this red without a code change — that is the accepted
      # trade for tracking upstream's hook rev.
      - name: Lint
        run: |
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .

      # pytest.ini carries --cov-fail-under, which ratchets upward only.
      - name: Test
        run: .venv/bin/pytest -q

      # The suite must be green as a WHOLE, not merely per file. Ten failures were
      # once hidden this way: module-level sys.modules stubs and a class-level
      # PropertyMock leak made results depend on collection order.
      - name: Guard against order-dependent tests
        run: |
          ! grep -rnE '^[[:space:]]*sys\.modules\[' tests/
          ! grep -rn 'type(mock_config_entry).options = PropertyMock' tests/

  load:
    name: artifact loads under declared requirements only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.14
        run: uv python install 3.14

      # The suite above cannot catch a missing manifest entry: its venv has HA's
      # full test extra, so a module importing something HA core does not ship
      # still resolves and only fails for users. This job installs exactly what
      # manifest.json declares, builds the release zip, and imports every module
      # out of it. It caught button.py importing homeassistant.components.bluetooth
      # at module scope -- which would have taken the entire button platform down
      # on any install without the bluetooth integration, with every test green.
      - name: Load test
        run: bash scripts/load_test.sh

      # Same scanner both release workflows run, so "safe to publish" has one
      # definition rather than three.
      - name: Build and scan the release artifact
        run: |
          cd custom_components/rivian
          zip -q -r ../../rivian.zip ./ \
            -i '*.py' '*.json' '*.js' '*.graphql' '*.proto' '*.yaml' 'py.typed'
          cd ../..
          bash scripts/scan_artifact.sh rivian.zip
