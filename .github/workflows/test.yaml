name: Tests

# Principle 4 of the vendoring plan: the CI that enforces the gates must exist
# BEFORE the risky work (the two upstream merges and the client vendoring), not
# after it. This repo previously had no test workflow at all — only
# pre-release.yaml, release.yaml and stale.yaml.
#
# Deliberately does NOT run on dev or dev-*: pre-release.yaml triggers there and
# publishes a zip that beta users install. Work happens on vendor-client.
on:
  push:
    branches:
      - main
      - vendor-client
  pull_request:
    branches:
      - main
      - dev
      - vendor-client

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # HA 2025.10.4 requires >=3.13.2. Homebrew's python@3.13 disappeared locally,
      # which is what broke the checked-in venv; uv pins the interpreter explicitly.
      - name: Set up Python 3.13
        run: uv python install 3.13

      # Every pin this needs lives in requirements_test.txt, deliberately: a green
      # suite must be reproducible from the repo, not from a recipe embedded in CI.
      - name: Create venv and install
        run: |
          uv venv --python 3.13 .venv
          VIRTUAL_ENV=$PWD/.venv uv pip install -r requirements_test.txt

      # Blocking repo-wide. An earlier revision deferred custom_components/ over
      # "25 pre-existing errors" — those were an artifact of an unpinned ruff
      # resolving 0.16.3. Under the pinned version the tree is clean, so there is
      # no debt to defer.
      - name: Lint
        run: |
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .

      # pytest.ini carries --cov-fail-under, which ratchets upward only.
      - name: Test
        run: .venv/bin/pytest -q

      # The suite must be green as a WHOLE, not merely per file. Ten failures were
      # once hidden this way: module-level sys.modules stubs and a class-level
      # PropertyMock leak made results depend on collection order.
      - name: Guard against order-dependent tests
        run: |
          ! grep -rnE '^[[:space:]]*sys\.modules\[' tests/
          ! grep -rn 'type(mock_config_entry).options = PropertyMock' tests/
