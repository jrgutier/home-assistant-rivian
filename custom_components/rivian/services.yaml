set_charging_schedule:
  name: Set Charging Schedule
  description: Set a time window for when the vehicle can charge
  target:
    device:
      integration: rivian
  fields:
    start_time:
      name: Start Time
      description: Time when charging is allowed to start (HH:MM format)
      required: true
      example: "22:00"
      selector:
        time:
    end_time:
      name: End Time
      description: Time when charging must stop (HH:MM format)
      required: true
      example: "06:00"
      selector:
        time:
    start_day:
      name: Start Day
      description: Day of week when schedule starts (0=Sunday, 6=Saturday)
      required: false
      default: 0
      example: 0
      selector:
        number:
          min: 0
          max: 6
          mode: box
    end_day:
      name: End Day
      description: Day of week when schedule ends (0=Sunday, 6=Saturday)
      required: false
      default: 6
      example: 6
      selector:
        number:
          min: 0
          max: 6
          mode: box

set_geofences:
  name: Set Geofences
  description: Set favorite geofences for the vehicle
  target:
    device:
      integration: rivian
  fields:
    fences:
      name: Geofences
      description: List of geofence definitions as JSON array. Each fence should have fence_id, name, latitude, longitude, radius_meters, and enabled fields.
      required: true
      example: '[{"fence_id": "home", "name": "Home", "latitude": 37.7749, "longitude": -122.4194, "radius_meters": 100, "enabled": true}]'
      selector:
        text:
          multiline: true
