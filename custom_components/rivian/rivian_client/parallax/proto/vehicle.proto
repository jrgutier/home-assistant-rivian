// vehicle.* Parallax payloads.
//
// Layout and names started from bretterer/rivian-python-client PR 205
// (commit 91b41cf). Every message one of this integration's decoders reads has
// been corrected to what that decoder reads; docs/development/PARALLAX_SCHEMAS.md
// lists each change and the three rules behind them:
//
//   optional   a field the decoder reports only when it was sent
//   uint64     an integer the decoder passes through unchanged (the app's
//              narrower type is in the comment)
//   undeclared a length-delimited field no decoder reads; a wrong guess at its
//              type would fail the parse of the whole message
//
// Generated code: scripts/regen_proto.sh. Do not edit *_pb2.py.

syntax = "proto3";

package rivian_ha.parallax.vehicle;


// vehicle.profiles.active_user -- the active driver's profile id (as in
// device_table.vas_keyper.devices). Changes with the key that unlocks.
message ActiveUserProfile {
  optional string active_user_profile_id = 1;
}

// vehicle.power.state
message VehiclePowerState {
  optional PowerState state = 1;
}

enum PowerState {
  POWER_STATE_UNSPECIFIED = 0;
  POWER_SLEEP = 1;
  POWER_STANDBY = 2;
  POWER_READY = 3;
  POWER_GO = 4;
  POWER_VEHICLE_RESET = 5;
  POWER_OTA_UPDATE = 6;
  POWER_SHUTDOWN = 7;
}

// vehicle.wheels.vehicle_wheels
message VehicleWheels {
  repeated Wheel wheel = 1;

  message Wheel {
    uint64 wheel_package = 1;              // app: int32
    uint64 tire_odometer = 2;              // meters
    int64 saved_tire_odometer_delta = 3;   // meters; only on an uninstalled wheel
    uint64 odometer_at_last_rotation = 4;  // meters
    int64 saved_odometer_at_last_rotation_delta = 5; // meters; ditto
    uint64 rotation_reminder_interval = 6; // meters
    bool is_installed = 7;
    // 8 updated_at {int64 seconds = 1} -- undeclared.
    uint64 tires = 9;                      // app: int32
    uint64 current_odometer = 10;          // meters
  }
}

// vehicle.network.state and vehicle.setting.network (same shape).
// Signals are dBm; -255 means no reading.
message NetworkState {
  ActiveInterface active_interface = 1; // the default link
  // 2 repeated InterfaceStatus interfaces -- undeclared.
  ConnectivityLevel connectivity_level = 3; // the default link's quality
  Wifi wifi = 4;
  Cellular cellular = 5;

  message InterfaceStatus {
    Route id = 1;
    RouteState status = 2;
  }

  enum Route {
    ROUTE_UNSPECIFIED = 0;
    ROUTE_WIFI = 1;
    ROUTE_CELLULAR_CORE = 2;
    ROUTE_CELLULAR_MEDIA = 3;
    ROUTE_CELLULAR_HOTSPOT = 4;
  }

  enum RouteState {
    ROUTE_STATE_UNSPECIFIED = 0;
    ROUTE_STATE_DOWN = 1;
    ROUTE_STATE_UP = 2;
  }

  // The three names are bytes, not string: an SSID is arbitrary bytes, and a
  // string field that is not UTF-8 fails the parse of the whole message. The
  // decoder decodes each one and drops only the one that will not decode.
  message Wifi {
    optional WpaStatus wpa_status = 1;
    ConnStatus conn_status = 2;
    optional bytes ssid = 3;
    // 4 bssid, 5 mac_address, 6 repeated IpAddress ip_addresses -- undeclared.
    optional ConnectivityLevel antenna_bars = 7;
    optional uint64 signal = 8;     // dBm; app: int32
    optional uint64 link_speed = 9; // app: int32
    optional uint64 freq = 10;      // app: int32
    int32 bandwidth = 11;
    optional WifiSecurity secure_status = 12;
    Ternary secured = 13;
    Ternary user_enabled = 14;
  }

  enum ConnStatus {
    CONN_STATUS_UNSPECIFIED = 0;
    CONN_STATUS_CHECKING = 1;
    CONN_STATUS_SUCCESS = 2;
    CONN_STATUS_UNSTABLE = 3;
    CONN_STATUS_NO_NETWORK = 4;
    CONN_STATUS_OUT_OF_SERVICE = 5;
    CONN_STATUS_CAPTIVE_PORTAL = 6;
    CONN_STATUS_DNS_ERROR = 7;
    CONN_STATUS_DHCP_ERROR = 8;
    CONN_STATUS_UNREACHABLE_UNKNOWN = 12;
  }

  enum Ternary {
    TERNARY_UNSPECIFIED = 0;
    TERNARY_FALSE = 1;
    TERNARY_TRUE = 2;
  }

  message IpAddress {
    string ipv4 = 1;
    string ipv6 = 2;
  }

  message Cellular {
    optional bytes carrier = 1;
    optional bytes mode = 2;    // e.g. "LTE"
    optional ConnectivityLevel antenna_bars = 3;
    optional uint64 signal_strength = 4; // dBm; app: int32
  }
}

enum ActiveInterface {
  ACTIVE_INTERFACE_UNSPECIFIED = 0;
  ACTIVE_INTERFACE_WIFI = 1;
  ACTIVE_INTERFACE_CELLULAR = 2;
}

enum ConnectivityLevel {
  CONNECTIVITY_LEVEL_UNSPECIFIED = 0;
  CONNECTIVITY_LEVEL_0 = 1;
  CONNECTIVITY_LEVEL_1 = 2;
  CONNECTIVITY_LEVEL_2 = 3;
  CONNECTIVITY_LEVEL_3 = 4;
  CONNECTIVITY_LEVEL_4 = 5;
}

enum WifiSecurity {
  WIFI_SECURITY_UNSPECIFIED = 0;
  WIFI_OPEN = 1;
  WIFI_WPA_PERSONAL = 2;
  WIFI_WPA_ENTERPRISE = 3;
  WIFI_WPA2_PERSONAL = 4;
  WIFI_WPA2_ENTERPRISE = 5;
  WIFI_WPA3_PERSONAL = 6;
  WIFI_WPA3_ENTERPRISE = 7;
  WIFI_ENHANCED_OPEN = 8;
}

enum WpaStatus {
  WPA_STATUS_UNSPECIFIED = 0;
  WPA_NOT_CONNECTED = 1;
  WPA_CONNECTED = 2;
  WPA_SCANNING = 3;
  WPA_CONNECTING = 4;
  WPA_DISCONNECTING = 5;
  WPA_CONNECTION_FAILED = 6;
  WPA_DISABLED = 7;
  WPA_SCAN_FAILURE = 8;
}
