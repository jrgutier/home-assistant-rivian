// comfort.* Parallax payloads.
//
// Layout and names started from bretterer/rivian-python-client PR 205
// (commit 91b41cf). Every message one of this integration's decoders reads has
// been corrected to what that decoder reads; docs/development/PARALLAX_SCHEMAS.md
// lists each change and the three rules behind them:
//
//   optional   a field the decoder reports only when it was sent
//   uint64     an integer the decoder passes through unchanged (the app's
//              narrower type is in the comment)
//   undeclared a length-delimited field no decoder reads; a wrong guess at its
//              type would fail the parse of the whole message
//
// Generated code: scripts/regen_proto.sh. Do not edit *_pb2.py.

syntax = "proto3";

package rivian_ha.parallax.comfort;


// comfort.cabin.hvac_settings_status
// Requested set point; 63.5 ("HI") while defrost runs.
message HvacSettingsStatus {
  optional float target_temperature = 1; // °C
}

// comfort.user_modes.state
message UserModesState {
  // MODE_STATUS, not bool: the app's enum has no OFF member, so "not on" is 0
  // and only 1 is on.
  ModeStatus in_service = 1;
  ModeStatus car_wash_mode = 2;
  // Enum types unknown.
  int32 pet_mode = 3;
  int32 camp_mode = 4;
  int32 transport_mode = 5;
  int32 climate_keep = 6;
  int32 factory_mode = 7;

  enum ModeStatus {
    MODE_STATUS_UNSPECIFIED = 0;
    MODE_STATUS_ON = 1;
  }
}

// comfort.cabin.cabin_preconditioning_status
message CabinPreconditioningStatus {
  PreconditioningStatus status = 1;
  PreconditioningType type = 2;
}

enum PreconditioningStatus {
  PRECONDITIONING_STATUS_UNSPECIFIED = 0;
  PRECONDITIONING_INITIATE = 1;
  PRECONDITIONING_ACTIVE = 2;
  PRECONDITIONING_ACTIVE_WARNING = 3;
  PRECONDITIONING_COMPLETE_MAINTAIN = 4;
  PRECONDITIONING_TIMEOUT_TEMP_NOT_ACHIEVED = 5;
  PRECONDITIONING_ERROR_SOC_LOW = 6;
  PRECONDITIONING_ERROR_SYSTEM_FAULT = 7;
  PRECONDITIONING_UNAVAILABLE = 8;
  PRECONDITIONING_TIMEOUT_COMPLETE = 9;
}

enum PreconditioningType {
  PRECONDITIONING_TYPE_UNSPECIFIED = 0;
  PRECONDITIONING_TYPE_USER_SELECTED = 1;
  PRECONDITIONING_TYPE_SCREEN_PROTECTION = 2;
  PRECONDITIONING_TYPE_SCHEDULED = 3;
  PRECONDITIONING_TYPE_AUTO_CABIN_VENTILATION = 4;
}

// comfort.cabin.cabin_temperatures
message CabinTemperatures {
  // 1 repeated ZoneTemperature temperatures {int32 seat, float temperature} --
  // undeclared.
  optional float exterior_temperature = 2; // °C
  optional float interior_temperature = 3; // °C
  // The app's interior display temperature: the set point, same as
  // HvacSettingsStatus's target. Not sent by every vehicle.
  optional float driver_set_point = 4; // °C
}

// comfort.cabin.cabin_ventilation_setting
message CabinVentilationSetting {
  optional bool auto_cabin_ventilation_enabled = 1;
  optional string mode = 2; // "AUTO" | "MANUAL" | "OFF"
  optional uint64 windows_open_percent = 3;
  optional uint64 sunroof_open_percent = 4;
  optional uint64 duration_minutes = 5;
}

// comfort.cabin.climate_hold_setting
// The one message this integration also SENDS. Not optional, on purpose: a
// zero duration has to serialise to nothing, which is how the vehicle itself
// reports "no hold".
message ClimateHoldSetting {
  uint64 hold_time_duration_seconds = 1; // app: int32
}

// comfort.cabin.climate_hold_status
message ClimateHoldStatus {
  optional ClimateHoldStatusValue status = 1;
  optional ClimateHoldAvailability availability = 2;
  ClimateHoldUnavailabilityReason unavailability_reason = 3;
  EndTime end_time = 4; // empty when no hold is running

  message EndTime {
    optional uint64 seconds = 1; // epoch seconds
  }
}

enum ClimateHoldStatusValue {
  CLIMATE_HOLD_STATUS_UNSPECIFIED = 0;
  CLIMATE_HOLD_STATUS_UNAVAILABLE = 1;
  CLIMATE_HOLD_STATUS_OFF = 2;
  CLIMATE_HOLD_STATUS_ON = 3;
  CLIMATE_HOLD_STATUS_FAULT = 4;
}

enum ClimateHoldAvailability {
  CLIMATE_HOLD_AVAILABILITY_UNSPECIFIED = 0;
  CLIMATE_HOLD_AVAILABLE = 1;
  CLIMATE_HOLD_CONTROLLABLE = 2;
  CLIMATE_HOLD_UNAVAILABLE = 3;
}

enum ClimateHoldUnavailabilityReason {
  CLIMATE_HOLD_UNAVAILABILITY_UNSPECIFIED = 0;
  CLIMATE_HOLD_UNAVAILABILITY_UNKNOWN = 1;
  CLIMATE_HOLD_UNAVAILABILITY_LOW_SOC = 2;
  CLIMATE_HOLD_UNAVAILABILITY_FAULT = 3;
}

// comfort.cabin.defrost_defog_status
message DefrostDefogStatus {
  DefrostStatus status = 1;
}

enum DefrostStatus {
  DEFROST_STATUS_UNSPECIFIED = 0;
  DEFROST_DEFOG = 1;
  DEFROST_ACTIVE = 2;
  DEFROST_DEFOG_DEFROST = 3;
  DEFROST_OFF = 4;
}

// comfort.cabin.pet_mode_status
message PetModeStatus {
  optional PetModeState status = 1; // PET_MODE_OFF (0) is reported when sent
  optional PetModeTemperatureStatus temperature_status = 2;
  PetModeCabinClimate cabin_climate = 3;
}

enum PetModeCabinClimate {
  PET_MODE_CABIN_CLIMATE_COMFORTABLE = 0;
  PET_MODE_CABIN_CLIMATE_COLD = 1;
  PET_MODE_CABIN_CLIMATE_HOT = 2;
}

enum PetModeState {
  PET_MODE_OFF = 0;
  PET_MODE_ON = 1;
  PET_MODE_DISABLED = 2;
  PET_MODE_FAULTY = 3;
}

enum PetModeTemperatureStatus {
  PET_MODE_TEMPERATURE_DEFAULT = 0;
  PET_MODE_TEMPERATURE_COLD = 1;
  PET_MODE_TEMPERATURE_HOT = 2;
  PET_MODE_TEMPERATURE_FAULTY = 3;
}

// comfort.cabin.seat_conditioning_status
message SeatConditioningStatus {
  message Surface {
    CabinSurface id = 1;
    ConditioningType type = 2;
    optional ConditioningLevel state = 3; // absent when off
  }
  repeated Surface surface = 1;
}

enum CabinSurface {
  CABIN_SURFACE_UNSPECIFIED = 0;
  STEERING_WHEEL = 1;
  REAR_GLASS = 2;
  FRONT_GLASS = 3;
  SIDEVIEW_MIRRORS = 4;
  SEAT_ROW_1_LEFT = 5;
  SEAT_ROW_1_MIDDLE = 6;
  SEAT_ROW_1_RIGHT = 7;
  SEAT_ROW_2_LEFT = 8;
  SEAT_ROW_2_MIDDLE = 9;
  SEAT_ROW_2_RIGHT = 10;
  SEAT_ROW_3_LEFT = 11;
  SEAT_ROW_3_MIDDLE = 12;
  SEAT_ROW_3_RIGHT = 13;
  WIPER_AREA = 14;
}

enum ConditioningType {
  CONDITIONING_TYPE_UNSPECIFIED = 0;
  CONDITIONING_HEAT = 1;
  CONDITIONING_VENT = 2;
}

enum ConditioningLevel {
  CONDITIONING_LEVEL_UNSPECIFIED = 0;
  CONDITIONING_LEVEL_1 = 1;
  CONDITIONING_LEVEL_2 = 2;
  CONDITIONING_LEVEL_3 = 3;
}
