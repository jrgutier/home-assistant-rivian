// device_table.* Parallax payloads.
//
// Layout and names started from bretterer/rivian-python-client PR 205
// (commit 91b41cf). Every message one of this integration's decoders reads has
// been corrected to what that decoder reads; docs/development/PARALLAX_SCHEMAS.md
// lists each change and the three rules behind them:
//
//   optional   a field the decoder reports only when it was sent
//   uint64     an integer the decoder passes through unchanged (the app's
//              narrower type is in the comment)
//   undeclared a length-delimited field no decoder reads; a wrong guess at its
//              type would fail the parse of the whole message
//
// Generated code: scripts/regen_proto.sh. Do not edit *_pb2.py.

syntax = "proto3";

package rivian_ha.parallax.device_table;


// device_table.vas_keyper.devices -- one key per message, for every driver
// on the vehicle. Sends partial updates (e.g. only credentials.info.status);
// a deleted key stays, marked inactive.
message VasKeyperDevices {
  Label label = 1;
  Device device = 2;
  Credentials credentials = 3;

  message Label {
    optional string name = 1;     // set on phone keys, e.g. the phone's name
    optional KeyType key_type = 3; // same as credentials.key_type
    optional bool deletable = 4;
    optional int32 wcc_version = 5;
  }

  message Device {
    optional string mapped_identity_id = 1; // "NNN-<uuid>-<suffix>"
    optional string hrid = 2;               // short human-readable id (key card)
    optional string profile_id = 3;         // the driver profile the key belongs to
    optional string public_key = 4;         // phone keys; 64 bytes as hex
    optional int32 revision = 5;            // key table revision when last written
    optional int32 vehicle_response_required = 6;
  }

  message Credentials {
    Info info = 1;
    KeyMaterial card = 5;  // key card; id is the GraphQL devices[].id
    KeyMaterial fob = 6;   // key fob
    KeyMaterial phone = 7; // phone keys; id is the phone's UUID
    optional KeyType key_type = 9;
    optional DeviceOem device_oem = 10;

    message Info {
      optional int32 a = 1; // unknown
      // 1 while active, INT32_MAX while inactive, else the pairing attempt.
      optional int32 c = 4;
      optional KeyStatus status = 5;
      optional int32 b = 6;
    }
  }

  enum KeyStatus {
    KEY_STATUS_UNSPECIFIED = 0;
    KEY_STATUS_ACTIVE = 1;
    KEY_STATUS_INACTIVE = 3;        // not paired, no longer paired, or deleted
    KEY_STATUS_WAITING_TO_PAIR = 5;
    KEY_STATUS_PAIRING = 7;         // a pairing attempt in progress
  }

  enum KeyType {
    KEY_TYPE_UNSPECIFIED = 0;
    KEY_TYPE_PHONE = 2;
    KEY_TYPE_KEY_CARD = 3;
    KEY_TYPE_KEY_FOB = 4; // inferred
  }

  enum DeviceOem {
    DEVICE_OEM_UNKNOWN = 0;
    DEVICE_OEM_RIVIAN = 1;
    DEVICE_OEM_APPLE = 2;
    DEVICE_OEM_GOOGLE = 3;
    DEVICE_OEM_SAMSUNG = 4;
    DEVICE_OEM_VW = 5;
  }

  message KeyMaterial {
    optional bytes id = 1;
    optional bytes credential = 2; // likely key material
  }
}
