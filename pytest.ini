[pytest]
asyncio_mode = auto
testpaths = tests
norecursedirs = .git .github .vscode .ruff_cache config custom_components com.rivian.android.consumer stubhub-setter
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --cov=custom_components.rivian
    --cov-report=term-missing
    --cov-report=html
    --cov-report=json:coverage.json
    # NOT --cov-fail-under: it is a single global number and cannot express
    # two populations with different obligations. scripts/check_coverage.py
    # enforces a floor for our code and a separate one for the vendored client.
    --timeout=30
markers =
    asyncio: mark test as async
